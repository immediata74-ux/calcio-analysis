name: Estrai app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Estrai ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP"

          TMP=$(mktemp -d)
          unzip -q "$ZIP" -d "$TMP"
          rm -f "$ZIP"

          shopt -s dotglob nullglob
          ITEMS=("$TMP"/*)

          if [ ${#ITEMS[@]} -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            cp -a "${ITEMS[0]}"/. .
          else
            cp -a "$TMP"/. .
          fi

          rm -rf "$TMP"

      - name: Salva file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Estrai Calcio Analysis" || exit 0
          git push
