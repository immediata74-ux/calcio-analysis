name: Reset progetto calcio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pulisci progetto vecchio
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          find .github/workflows -type f ! -name 'reset-progetto.yml' -delete
          mkdir -p app/api/analysis

      - name: Scrivi package.json
        run: |
          echo '' | base64 -d > 'package.json'

      - name: Scrivi app/layout.js
        run: |
          echo '' | base64 -d > 'app/layout.js'

      - name: Scrivi app/page.js
        run: |
          echo '' | base64 -d > 'app/page.js'

      - name: Scrivi app/api/analysis/route.js
        run: |
          echo '' | base64 -d > 'app/api/analysis/route.js'

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ripartenza pulita Calcio Analysis mobile" || exit 0
          git push
